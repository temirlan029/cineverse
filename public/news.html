<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новости — CineVerse</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#e8b84b" />
    <style>
      .news-hero {
        padding: 60px 0 40px;
        text-align: center;
      }

      .news-hero h1 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        margin-bottom: 12px;
      }

      .news-hero p {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .news-tabs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 28px;
        flex-wrap: wrap;
      }

      .news-tab {
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.25s;
      }

      .news-tab:hover,
      .news-tab.active {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(232, 184, 75, 0.08);
      }

      .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 48px;
      }

      .news-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: all 0.3s;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        display: block;
      }

      .news-card:hover {
        border-color: rgba(232, 184, 75, 0.3);
        transform: translateY(-4px);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      }

      .news-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        background: var(--bg3);
      }

      .news-img-placeholder {
        width: 100%;
        height: 180px;
        background: var(--bg3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: var(--muted);
      }

      .news-body {
        padding: 18px;
      }

      .news-date {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .news-title {
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        line-height: 1.4;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .news-desc {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .news-source {
        margin-top: 12px;
        font-size: 0.72rem;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .loading-spinner {
        display: flex;
        justify-content: center;
        padding: 60px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .status-text {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
      }

      .status-text .icon {
        font-size: 3rem;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .news-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="nav-logo">CINE<span>VERSE</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="kinopoisk.html">Кинопоиск</a></li>
        <li><a href="minigames.html">Игры</a></li>
        <li><a href="music.html">Музыка</a></li>
        <li><a href="news.html" class="active">Новости</a></li>
        <li><a href="weather.html">Погода</a></li>
        <li><a href="anime.html">Аниме</a></li>
        <li><a href="profile.html">Профиль</a></li>
        <li><a href="about.html">О проекте</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle"></button>
      <button class="burger" id="burger" onclick="document.getElementById('burger').classList.toggle('active');document.querySelector('.nav-links').classList.toggle('open')"><span></span><span></span><span></span></button>
      <div class="nav-auth" id="nav-auth"></div>
    </nav>

    <div id="auth-modal" class="modal-overlay">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2 id="modal-title"></h2>
        <p id="modal-sub"></p>
        <div id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <main>
      <section class="news-hero section">
        <div class="container">
          <span class="tag tag-red" style="margin-bottom:16px;display:inline-block">Лента</span>
          <h1>СВЕЖИЕ <span class="gold">НОВОСТИ</span></h1>
          <p>Последние новости из открытых источников</p>
          <div class="news-tabs">
            <button class="news-tab active" onclick="loadFeed('lenta')">Lenta.ru</button>
            <button class="news-tab" onclick="loadFeed('rbc')">RBC</button>
            <button class="news-tab" onclick="loadFeed('ria')">РИА Новости</button>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="container">
          <div id="news-container">
            <div class="loading-spinner"><div class="spinner"></div></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div>&copy; 2025 CineVerse</div>
      <div style="display:flex;gap:20px">
        <a href="kinopoisk.html">Кинопоиск</a>
        <a href="minigames.html">Игры</a>
        <a href="news.html">Новости</a>
      </div>
    </footer>

    <script src="auth.js"></script>
    <script>
      var feeds = {
        lenta: "https://lenta.ru/rss",
        rbc: "https://rssexport.rbc.ru/rbcnews/news/20/full.rss",
        ria: "https://ria.ru/export/rss2/archive/index.xml"
      };

      var currentFeed = "lenta";

      function loadFeed(name) {
        currentFeed = name;
        var tabs = document.querySelectorAll(".news-tab");
        tabs.forEach(function(t) { t.classList.remove("active"); });
        event.target.classList.add("active");
        fetchNews();
      }

      function fetchNews() {
        var container = document.getElementById("news-container");
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

        var url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feeds[currentFeed]);

        fetch(url)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.status !== "ok" || !data.items || !data.items.length) {
              container.innerHTML = '<div class="status-text"><div class="icon">📰</div><p>Не удалось загрузить новости</p></div>';
              return;
            }

            var grid = document.createElement("div");
            grid.className = "news-grid";

            var items = data.items.slice(0, 12);
            items.forEach(function(item, i) {
              var title = item.title || "";
              var link = item.link || "#";
              var desc = (item.description || item.content || "").replace(/<[^>]*>/g, "").trim();
              if (desc.length > 200) desc = desc.substring(0, 200) + "...";

              var imgMatch = "";
              if (item.thumbnail) imgMatch = item.thumbnail;
              if (!imgMatch && item.enclosure && item.enclosure.link) imgMatch = item.enclosure.link;
              if (!imgMatch) {
                var srcMatch = (item.description || "").match(/src="([^"]+)"/);
                if (srcMatch) imgMatch = srcMatch[1];
              }

              var dateStr = "";
              if (item.pubDate) {
                var d = new Date(item.pubDate);
                dateStr = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
              }

              var card = document.createElement("a");
              card.className = "news-card fade-up";
              card.style.animationDelay = (i * 0.05) + "s";
              card.href = link;
              card.target = "_blank";
              card.rel = "noopener";

              var imgHtml = imgMatch
                ? '<img class="news-img" src="' + imgMatch + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=news-img-placeholder>📰</div>\'">'
                : '<div class="news-img-placeholder">📰</div>';

              card.innerHTML = imgHtml +
                '<div class="news-body">' +
                  '<div class="news-date">' + dateStr + '</div>' +
                  '<div class="news-title">' + title + '</div>' +
                  '<div class="news-desc">' + desc + '</div>' +
                  '<div class="news-source">' + currentFeed.toUpperCase() + '</div>' +
                '</div>';

              grid.appendChild(card);
            });

            container.innerHTML = "";
            container.appendChild(grid);
          })
          .catch(function() {
            container.innerHTML = '<div class="status-text"><div class="icon">⚠️</div><p>Ошибка загрузки новостей</p></div>';
          });
      }

      fetchNews();
    </script>
    <button class="scroll-top" id="scroll-top">&uarr;</button>
    <script src="global.js"></script>
  </body>
</html>
